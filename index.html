<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hi!story 代理カードメモ ジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Hi!story 代理カードメモ ジェネレーター</h1>
    <p class="sub">カードを検索して枚数を指定し、A4印刷用PDFを生成します</p>
    <nav class="app-nav"><a href="explorer.html">→ カード検索・関連カード探索アプリ</a></nav>
  </header>

  <main>
    <section class="search-section">
      <input id="searchBox" type="text" placeholder="カード名・通称・属性・効果文で検索（例：ジェンキンス）" autocomplete="off" />
      <div class="filter-row">
        <select id="filterAttackDefense"><option value="">攻撃/防御/事変：すべて</option></select>
        <select id="filterRank"><option value="">ランク/レベル：すべて</option></select>
        <select id="filterAttribute"><option value="">属性：すべて</option></select>
      </div>
      <ul id="results" class="results"></ul>
    </section>

    <section class="marker-section">
      <button id="toggleMarkerBtn" type="button" class="csv-toggle">⛔ マーカーを作成（状態異常・先攻後攻）</button>
      <div id="markerPanel" class="csv-panel" style="display:none">
        <p class="hint">「追加」でキューに加わり、代理カードと同じサイズ・同じA4シートに印刷できます。</p>
        <div class="marker-settings">
          <img id="markerPreview" class="marker-preview" alt="マーカーのプレビュー" />
          <div class="marker-settings-controls">
            <label>文字の向き
              <select id="markerRotation">
                <option value="90">右に90°（上から下へ読む）</option>
                <option value="-90">左に90°（下から上へ読む）</option>
              </select>
            </label>
            <label>背景画像
              <input id="markerBgInput" type="file" accept="image/*" />
            </label>
            <label>背景の濃さ
              <input id="markerBgOpacity" type="range" min="5" max="60" step="5" value="25" />
              <span id="markerBgOpacityVal">25%</span>
            </label>
            <button id="markerBgClearBtn" type="button" class="secondary">背景を削除</button>
            <p id="markerBgStatus" class="hint"></p>
          </div>
        </div>
        <ul id="markerList" class="marker-list"></ul>
        <div class="marker-custom">
          <input id="markerCustomInput" type="text" placeholder="自由入力（改行は / で指定　例：ランク3以上を/セットできない）" autocomplete="off" />
          <button id="markerCustomBtn" type="button">追加</button>
        </div>
      </div>
    </section>

    <section class="csv-section">
      <button id="toggleCsvBtn" type="button" class="csv-toggle">📋 CSVからデッキを一括登録</button>
      <div id="csvPanel" class="csv-panel" style="display:none">
        <p class="hint">deck_code / card_id / count 列を含むCSVを貼り付けてください（card_idで照合し、countの枚数だけキューに追加します）。</p>
        <textarea id="csvInput" rows="6" placeholder="&quot;deck_code&quot;,&quot;deck_name&quot;,&quot;card_name&quot;,...,&quot;count&quot;,...,&quot;card_id&quot;,..."></textarea>
        <button id="csvImportBtn" type="button">CSVを読み込んでキューに追加</button>
        <p id="csvStatus" class="status"></p>
      </div>
    </section>

    <section class="queue-section">
      <h2>選択中のカード <span id="totalCount">(0枚)</span></h2>
      <ul id="queue" class="queue"></ul>
      <p class="hint">1枚のA4に最大9枚まで配置されます。9枚を超える分は自動で次のページに送られます。</p>
      <button id="generateBtn" disabled>PDFを生成してダウンロード</button>
      <p id="status" class="status"></p>
    </section>
  </main>

  <canvas id="workCanvas" width="630" height="880" style="display:none"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="common.js"></script>
  <script src="script.js"></script>
</body>
</html>
